name: sccf-platform-ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  lint: { runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {run: "cd backend && npm install && npm run lint"}] }
  unit-tests: { runs-on: ubuntu-latest, needs: lint, steps: [{uses: actions/checkout@v4}, {run: "cd backend && npm install && npm test"}] }
  build: { runs-on: ubuntu-latest, needs: unit-tests, steps: [{uses: actions/checkout@v4}, {run: "cd backend && npm install && npm run build"}] }
